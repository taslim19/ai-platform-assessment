<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">AI QA platform architecture</title><desc id="desc">Users pass through a load balancer to stateless FastAPI replicas with JWT authorization. Redis coordinates rate limits, leases and optional cache. PostgreSQL stores users and audit metadata. A logical gateway calls primary or fallback LLMs. Dashed lines are proposed OIDC and asynchronous queue extensions.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8ba9c6"/></marker><style>text{font-family:Arial,sans-serif;fill:#eaf1fa} .title{font-size:32px;font-weight:700}.label{font-size:20px;font-weight:700}.sub{font-size:15px;fill:#aebfd3}.box{fill:#142337;stroke:#36506e;stroke-width:2;rx:14}.accent{stroke:#4bd5c5}.future{stroke-dasharray:7 5}.edge{fill:none;stroke:#8ba9c6;stroke-width:2;marker-end:url(#a)}</style></defs>
<rect width="1400" height="850" fill="#091322"/><text x="60" y="65" class="title">AI QUESTION-ANSWERING PLATFORM</text><text x="60" y="99" class="sub">Implemented synchronous path · managed state · bounded provider admission</text>
<rect x="60" y="200" width="165" height="95" class="box"/><text x="142" y="240" text-anchor="middle" class="label">Users</text><text x="142" y="267" text-anchor="middle" class="sub">Bearer JWT</text>
<rect x="290" y="200" width="210" height="95" class="box"/><text x="395" y="240" text-anchor="middle" class="label">Load balancer</text><text x="395" y="267" text-anchor="middle" class="sub">Nginx / TLS ingress</text>
<rect x="570" y="180" width="245" height="135" class="box accent"/><text x="692" y="221" text-anchor="middle" class="label">FastAPI replicas</text><text x="692" y="250" text-anchor="middle" class="sub">JWT + RBAC · async I/O</text><text x="692" y="277" text-anchor="middle" class="sub">Request IDs · metrics</text>
<rect x="890" y="200" width="215" height="95" class="box accent"/><text x="997" y="240" text-anchor="middle" class="label">LLM gateway</text><text x="997" y="267" text-anchor="middle" class="sub">In-process logical layer</text>
<rect x="1170" y="140" width="180" height="90" class="box"/><text x="1260" y="178" text-anchor="middle" class="label">Primary LLM</text><text x="1260" y="205" text-anchor="middle" class="sub">API / local server</text>
<rect x="1170" y="270" width="180" height="90" class="box"/><text x="1260" y="308" text-anchor="middle" class="label">Fallback LLM</text><text x="1260" y="335" text-anchor="middle" class="sub">Optional config</text>
<path d="M225 247H290M500 247H570M815 247H890M1105 230L1170 185M1105 265L1170 315" class="edge"/>
<rect x="420" y="435" width="245" height="110" class="box"/><text x="542" y="475" text-anchor="middle" class="label">Redis</text><text x="542" y="503" text-anchor="middle" class="sub">Limits · leases · TTL cache</text><text x="542" y="527" text-anchor="middle" class="sub">Shared across replicas</text>
<rect x="720" y="435" width="245" height="110" class="box"/><text x="842" y="475" text-anchor="middle" class="label">PostgreSQL</text><text x="842" y="503" text-anchor="middle" class="sub">Users · roles · audit metadata</text><text x="842" y="527" text-anchor="middle" class="sub">No raw chat persistence</text>
<path d="M650 315L542 435M740 315L842 435" class="edge"/>
<rect x="60" y="435" width="285" height="110" class="box"/><text x="202" y="475" text-anchor="middle" class="label">Prometheus / alerts</text><text x="202" y="503" text-anchor="middle" class="sub">Admin-authenticated scraping</text><text x="202" y="527" text-anchor="middle" class="sub">Latency · tokens · provider errors</text><path d="M202 435V355H590V315" class="edge"/>
<rect x="60" y="650" width="320" height="100" class="box future"/><text x="220" y="690" text-anchor="middle" class="label">OIDC identity provider</text><text x="220" y="720" text-anchor="middle" class="sub">Proposed: PKCE · JWKS · scopes</text><path d="M220 650V590H370V295" class="edge future"/>
<rect x="1010" y="455" width="340" height="100" class="box future"/><text x="1180" y="494" text-anchor="middle" class="label">Durable queue + workers</text><text x="1180" y="524" text-anchor="middle" class="sub">Proposed: jobs · DLQ · idempotency</text><path d="M815 300L1010 455M1180 455V405H997V295" class="edge future"/>
<text x="440" y="685" class="label">Guardrails, not unlimited capacity</text><text x="440" y="718" class="sub">Bounded deadlines + retries · fail-closed Redis admission · provider quota planning</text><text x="440" y="748" class="sub">100 RPS × 5 s = 500 in flight · 500 RPS × 5 s = 2,500 in flight (illustrative)</text><text x="60" y="810" class="sub">Solid = implemented path   |   Dashed = documented extensions   |   Kubernetes manifests are deployment examples, not a live-cluster claim</text>
</svg>
