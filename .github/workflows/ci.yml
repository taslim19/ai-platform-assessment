name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application test dependencies and deployment YAML parser
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install PyYAML==6.0.2
      - name: Compile and unit test
        run: |
          python -m compileall -q app alembic scripts tests
          python -m pytest -q
      - name: Lint if the project provides ruff
        run: |
          if python -m pip show ruff >/dev/null 2>&1; then
            python -m ruff check app scripts tests
          else
            printf '%s\n' 'ruff is not declared in requirements-dev.txt; optional lint skipped'
          fi
      - name: Validate deployment contracts
        run: python scripts/validate_deploy.py
      - name: Generate isolated local configuration and validate Compose
        run: |
          python scripts/setup_env.py
          docker compose config --quiet
          docker compose --profile monitoring config --quiet
      - name: Build nonroot API container
        run: docker build --tag aiqa-api:ci .
      - name: Check Prometheus configuration and alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" prom/prometheus:v3.5.0 check config --syntax-only /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" prom/prometheus:v3.5.0 check rules /etc/prometheus/alerts.yml
      - name: Remove generated credentials
        if: always()
        run: rm -f .env
