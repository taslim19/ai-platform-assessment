global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: aiqa
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/metrics/token
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000
        refresh_interval: 5s
