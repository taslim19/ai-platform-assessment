apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiqa-api
  namespace: aiqa
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
    - hosts: [qa.example.com]
      secretName: aiqa-tls
  rules:
    - host: qa.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aiqa-api
                port: {number: 8000}
